name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            dist
            server-dist
          retention-days: 7

  e2e:
    name: Browser tests (Playwright)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  audit:
    name: Lighthouse and security headers (pre-release)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: build
      - name: Start the site on a throwaway database
        run: |
          DATA_DIR="$RUNNER_TEMP/data" PORT=4190 PUBLIC_URL=http://127.0.0.1:4190 node server-dist/server/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:4190/api/health && break; sleep 1; done
      - run: node scripts/check-headers.mjs http://127.0.0.1:4190
      - run: npx lhci autorun --config=lighthouserc.json
